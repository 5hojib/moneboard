name: Build Android APK

on:
  push:
    branches: [main, apk]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      monetag_api_key:
        description: 'Monetag API key to bake into the APK (optional, defaults to the bundled key)'
        required: false
        type: string
      total_withdrawals:
        description: 'Total withdrawn USD for the balance calculation (optional, default 0)'
        required: false
        type: number

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:android
        env:
          VITE_MONETAG_API_KEY: ${{ inputs.monetag_api_key || secrets.MONETAG_API_KEY || '' }}
          VITE_MONETAG_TOTAL_WITHDRAWALS: ${{ inputs.total_withdrawals || secrets.MONETAG_TOTAL_WITHDRAWALS || '' }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Compute app version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            # Bump the version on every push: <major>.<minor>.<run_number>
            VER="1.1.${{ github.run_number }}"
          fi
          CODE="${{ github.run_number }}"
          echo "version_name=$VER" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "apk_name=Monetag-Publisher-$VER.apk" >> "$GITHUB_OUTPUT"

      - name: Build release APK (signed with the committed release keystore)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionName=${{ steps.version.outputs.version_name }} \
            -PversionCode=${{ steps.version.outputs.version_code }}

      - name: Upload APK to workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release (create on first push to this version, update on re-runs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="${{ steps.version.outputs.release_tag }}"
          RELEASE_NAME="Monetag Publisher ${{ steps.version.outputs.version_name }}"
          APK="android/app/build/outputs/apk/release/app-release.apk"

          # Create the release if it does not exist yet, otherwise just (re)upload the APK.
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists — updating assets."
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "$APK"
          else
            echo "Creating release $RELEASE_TAG."
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_NAME" \
              --generate-notes \
              "$APK"
          fi