<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Clean dark neutral rounded squircle background -->
  <rect width="512" height="512" rx="128" fill="#090d16" />

  <!-- Minimal border glow -->
  <rect x="6" y="6" width="500" height="500" rx="122" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="4" />

  <!-- Elegant minimalist geometric monogram: Modern clean "M" formed by precise upward bars -->
  <!-- Left Pillar -->
  <rect x="116" y="156" width="44" height="200" rx="22" fill="url(#brandGrad)" />

  <!-- Right Pillar -->
  <rect x="352" y="156" width="44" height="200" rx="22" fill="url(#brandGrad)" />

  <!-- Central chevron peak / data ascent -->
  <path d="M 194 212 L 256 288 L 318 212" fill="none" stroke="url(#brandGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Precision spark dot / notification accent -->
  <circle cx="256" cy="144" r="18" fill="#38bdf8" />
</svg>
