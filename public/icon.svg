<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="fillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle border accent -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="6" />

  <!-- Metric / Chart Geometry -->
  <!-- Grid lines -->
  <line x1="80" y1="360" x2="432" y2="360" stroke="#334155" stroke-width="3" stroke-dasharray="8 8" />
  <line x1="80" y1="280" x2="432" y2="280" stroke="#334155" stroke-width="3" stroke-dasharray="8 8" />
  <line x1="80" y1="200" x2="432" y2="200" stroke="#334155" stroke-width="3" stroke-dasharray="8 8" />

  <!-- Trend Area Fill -->
  <path d="M 96 340 Q 150 310, 200 240 T 320 210 T 416 140 L 416 360 L 96 360 Z" fill="url(#fillGrad)" />

  <!-- Trend Stroke Line -->
  <path d="M 96 340 Q 150 310, 200 240 T 320 210 T 416 140" fill="none" stroke="url(#lineGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Data point circles -->
  <circle cx="200" cy="240" r="10" fill="#38bdf8" />
  <circle cx="320" cy="210" r="10" fill="#38bdf8" />
  <circle cx="416" cy="140" r="16" fill="#0284c7" stroke="#ffffff" stroke-width="6" />

  <!-- Monetag / Currency Symbol Badge -->
  <circle cx="160" cy="150" r="44" fill="#0ea5e9" />
  <text x="160" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">$</text>
</svg>
